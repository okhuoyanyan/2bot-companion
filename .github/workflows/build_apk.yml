name: 🚀 Build Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🎯 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: 🔍 Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      # WO-36 §3.3：Dart 单测进 CI（协议帧 / 重试 / dot-stuffing / ENC1 跨语言 KAT）
      - name: 🧪 Run Dart Unit Tests
        run: flutter test

      # WO-36 §3.3：签名凭据经 GitHub Secrets 注入，keystore 与 key.properties 均不落仓库
      - name: 🔐 Inject Signing Credentials (from Secrets)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
            echo "✅ 已注入新 keystore（WO-36 密钥轮换生效）"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64 —— 回退使用仓库内旧 keystore。旧密钥永久视为泄露，请尽快完成轮换（§3.3）！"
          fi

      - name: 🔨 Build Release APK
        run: flutter build apk --release

      - name: 🏷️ Prepare APK Artifact Name
        id: prep
        run: |
          BUILD_TIME=$(date +'%Y%m%d_%H%M%S')
          APK_NAME="2bot-companion-${BUILD_TIME}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2bot-companion-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📝 Extract Release Notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ github.ref_name }}"
          if [ -f CHANGELOG.md ]; then
            python3 -c "
          import sys, re
          tag = sys.argv[1]
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()
          pattern = r'## \[' + re.escape(tag) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              notes = match.group(1).strip()
              with open('RELEASE_BODY.md', 'w', encoding='utf-8') as out:
                  out.write(f'# 2BOT 伴侣端 {tag} 发布说明\n\n' + notes + '\n\n---\n### 📦 安装包直链下载\n直接下载下方附件中的 `app-release.apk` 即可在 Android 手机直接安装使用。')
          else:
              with open('RELEASE_BODY.md', 'w', encoding='utf-8') as out:
                  out.write(f'# 2BOT 伴侣端 {tag}\n\n100% 纯血开源、0 广告、超低功耗设备状态感知客户端。\n\n直接下载下方附件中的 `app-release.apk` 即可安装使用。')
          " "$TAG"
          else
            echo "2BOT 伴侣端 $TAG 发布" > RELEASE_BODY.md
          fi

      - name: 🌟 Create GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/${{ steps.prep.outputs.apk_name }}
          name: 2BOT 伴侣端 ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
