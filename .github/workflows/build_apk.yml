name: 🚀 Build Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🎯 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: 🔍 Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      # WO-36-MOBILE-CI-FIX §六(a)：静态分析**只让真错误致命**（--no-fatal-warnings/--no-fatal-infos）。
      # 比 `|| true` 更正确：保留"编译错误必须拦住构建"的能力，同时不被存量告警阻塞。
      # 失败时把 error 行以 ::error:: 注解公开输出（Actions 原始日志需登录，注解面板公开可读）。
      - name: 🔎 Static Analysis (仅错误致命)
        run: |
          set +e
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee /tmp/analyze.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -m 12 -E "^\s*error" /tmp/analyze.log | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code

      # WO-36 §3.3：Dart 单测进 CI（协议帧 / 重试 / dot-stuffing / ENC1 跨语言 KAT）
      # WO-36-MOBILE-CI-FIX §六(b)：失败详情同样以 ::error:: 注解公开输出，解决"日志需登录"的可观测性盲区。
      - name: 🧪 Run Dart Unit Tests
        run: |
          set +e
          flutter test 2>&1 | tee /tmp/test.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            # 先按已知模式精提（命中则逐条注解）
            grep -m 12 -E "Failed to load|Error:|error •|Expected:|Actual:|\[E\]|Test failed|Which:" /tmp/test.log | while IFS= read -r l; do echo "::error::$l"; done
            # 兜底：剔除「通过用例」摘要行后 dump 尾部 —— 剩余的即为失败块（Actions 原始日志需登录，注解公开可读）
            echo "::error::---- flutter test 失败块（已剔除 ✅ 通过行） ----"
            grep -v '✅' /tmp/test.log | tail -n 40 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code

      # WO-36 §3.3：签名凭据经 GitHub Secrets 注入，keystore 与 key.properties 均不落仓库
      - name: 🔐 Inject Signing Credentials (from Secrets)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
            echo "✅ 已注入新 keystore（WO-36 密钥轮换生效）"
          else
            echo "::error::未配置 ANDROID_KEYSTORE_BASE64 —— release 签名无法进行。旧 keystore 已彻底退出签名链（永久视为泄露），本工作流不再提供任何回退路径。请在仓库 Settings → Secrets and variables → Actions 配置 ANDROID_KEYSTORE_BASE64 / ANDROID_STORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD 后重试。"
            exit 1
          fi

      - name: 🔨 Build Release APK
        run: flutter build apk --release

      # WO-36-RELEASE §1：签名指纹公开核验（教训 14 ——「已用新密钥」不能是自述，
      # 必须有免登录可见的公开证据）。预期指纹由管理员侧 keystore 独立核对。
      - name: 🔍 Verify APK Signing Fingerprint
        run: |
          set +e
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "::notice::APK 签名证书指纹（SHA256）："
          keytool -printcert -jarfile "$APK" 2>&1 | tee /tmp/cert.log
          FP=$(grep -i "SHA256:" /tmp/cert.log | head -1 | sed 's/.*SHA256: //' | tr -d '\r')
          echo "::notice::SHA256 = ${FP}"
          echo "### 🔐 APK 签名指纹（SHA256）" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${FP}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "预期: 84:16:0A:1A:43:AB:7F:C4:EE:E7:E7:9D:84:A5:F2:FA:AC:23:6D:D0:C6:F6:B6:38:D6:EB:08:5A:CA:51:7C:55" >> $GITHUB_STEP_SUMMARY
          EXPECTED="84:16:0A:1A:43:AB:7F:C4:EE:E7:E7:9D:84:A5:F2:FA:AC:23:6D:D0:C6:F6:B6:38:D6:EB:08:5A:CA:51:7C:55"
          if [ "$FP" = "$EXPECTED" ]; then
            echo "::notice::✅ 签名指纹与预期一致 —— 确认由新 KEY 签发"
          else
            echo "::error::签名指纹与预期不一致！实际 ${FP}，预期 ${EXPECTED} —— 可能仍在使用旧密钥或 Secrets 配置有误，请勿分发。"
            exit 1
          fi

      - name: 🏷️ Prepare APK Artifact Name
        id: prep
        run: |
          BUILD_TIME=$(date +'%Y%m%d_%H%M%S')
          APK_NAME="2bot-companion-${BUILD_TIME}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2bot-companion-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📝 Extract Release Notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ github.ref_name }}"
          if [ -f CHANGELOG.md ]; then
            python3 -c "
          import sys, re
          tag = sys.argv[1]
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()
          pattern = r'## \[' + re.escape(tag) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              notes = match.group(1).strip()
              with open('RELEASE_BODY.md', 'w', encoding='utf-8') as out:
                  out.write(f'# 2BOT 伴侣端 {tag} 发布说明\n\n' + notes + '\n\n---\n### 📦 安装包直链下载\n直接下载下方附件中的 `app-release.apk` 即可在 Android 手机直接安装使用。')
          else:
              with open('RELEASE_BODY.md', 'w', encoding='utf-8') as out:
                  out.write(f'# 2BOT 伴侣端 {tag}\n\n100% 纯血开源、0 广告、超低功耗设备状态感知客户端。\n\n直接下载下方附件中的 `app-release.apk` 即可安装使用。')
          " "$TAG"
          else
            echo "2BOT 伴侣端 $TAG 发布" > RELEASE_BODY.md
          fi

      - name: 🌟 Create GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/${{ steps.prep.outputs.apk_name }}
          name: 2BOT 伴侣端 ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
