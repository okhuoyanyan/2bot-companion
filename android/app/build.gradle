plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.0'
}

// WO-36 §3.3：签名凭据从 key.properties 读取（该文件由 CI 依 GitHub Secrets 在构建期生成，已被 .gitignore 排除）
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.twobot.companion"
    compileSdk 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.twobot.companion"
        minSdk 21
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            // WO-36 §3.3：优先从 CI 注入的 key.properties 读取（密钥经 GitHub Secrets 下发，
            // keystore 文件由 workflow 在构建期生成，二者均不落仓库）。
            def storeFilePath = keystoreProperties.getProperty('storeFile')
            if (storeFilePath != null) {
                storeFile file(storeFilePath)
                // WO-36 §3.3.1：新密钥由 openssl 生成 PKCS12；此处显式声明以免受 JDK 默认 storeType 漂移影响
                storeType keystoreProperties.getProperty('storeType') ?: 'PKCS12'
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            } else {
                // WO-36-RELEASE §1：旧 keystore 已彻底退出签名链（永久视为泄露）。
                // 缺 key.properties 一律**显式失败**，杜绝任何静默回退到旧密钥的可能。
                throw new GradleException(
                    "缺少 android/key.properties —— 无法完成 release 签名。\n" +
                    "CI 环境：请在仓库 Settings → Secrets and variables → Actions 配置 " +
                    "ANDROID_KEYSTORE_BASE64 / ANDROID_STORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD，" +
                    "workflow 会据其生成 key.properties 与 keystore 文件。\n" +
                    "本地环境：请在 android/key.properties 填入 storeFile / storeType / storePassword / keyAlias / keyPassword。"
                )
            }
        }
    }

    buildTypes {
        release {
            // WO-36-RELEASE §1：签名配置恒为 release（key.properties 缺失时已于 signingConfigs 内显式失败，
            // 不再存在"旧 keystore 在则 release、否则退 debug"的静默降级路径）
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}
